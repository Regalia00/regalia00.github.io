<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ceci est le site de Thibault</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at 20% 20%, rgba(0, 180, 255, 0.18), transparent 30%),
        radial-gradient(circle at 80% 70%, rgba(0, 255, 120, 0.12), transparent 28%),
        linear-gradient(135deg, #02070d 0%, #050b12 45%, #010308 100%);
      color: #e8f7ff;
      font-family: "Segoe UI", Arial, sans-serif;
      overflow: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(0, 180, 255, 0.06) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 180, 255, 0.06) 1px, transparent 1px);
      background-size: 42px 42px;
      mask-image: radial-gradient(circle, black 40%, transparent 85%);
      pointer-events: none;
    }

    .page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px;
    }

    .panel {
      position: relative;
      width: min(980px, 100%);
      min-height: 520px;
      border: 1px solid rgba(0, 180, 255, 0.75);
      background: rgba(2, 8, 14, 0.82);
      box-shadow:
        0 0 28px rgba(0, 180, 255, 0.28),
        inset 0 0 40px rgba(0, 180, 255, 0.06);
      clip-path: polygon(0 0, calc(100% - 22px) 0, 100% 22px, 100% 100%, 22px 100%, 0 calc(100% - 22px));
      padding: 34px;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 88px;
      color: #00b7ff;
      font-family: Consolas, monospace;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    .tag {
      border: 1px solid rgba(0, 180, 255, 0.7);
      padding: 10px 16px;
      clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
      background: rgba(0, 180, 255, 0.06);
    }

    .content {
      text-align: center;
    }

    h1 {
      font-size: clamp(2.4rem, 8vw, 6.8rem);
      line-height: 0.95;
      text-transform: uppercase;
      letter-spacing: -2px;
      color: #ffffff;
      text-shadow:
        0 0 10px rgba(0, 180, 255, 0.75),
        0 0 28px rgba(0, 180, 255, 0.4);
    }

    h1 span {
      display: block;
      color: #00aaff;
    }

    .subtitle {
      margin-top: 24px;
      font-size: clamp(1.1rem, 2.2vw, 1.6rem);
      color: #c8d7df;
      letter-spacing: 0.5px;
    }

    .terminal {
      margin: 46px auto 0;
      width: min(620px, 100%);
      text-align: left;
      border: 1px solid rgba(120, 255, 80, 0.55);
      background: rgba(0, 0, 0, 0.58);
      box-shadow: inset 0 0 22px rgba(120, 255, 80, 0.08);
      border-radius: 8px;
      padding: 18px 20px;
      font-family: Consolas, monospace;
      color: #77ff4f;
    }

    .cursor {
      display: inline-block;
      width: 9px;
      height: 18px;
      background: #77ff4f;
      margin-left: 4px;
      animation: blink 1s infinite;
      vertical-align: middle;
    }

    .corner {
      position: absolute;
      width: 74px;
      height: 74px;
      border-color: #00b7ff;
      opacity: 0.9;
    }

    .corner.tl { top: 16px; left: 16px; border-top: 3px solid; border-left: 3px solid; }
    .corner.br { right: 16px; bottom: 16px; border-right: 3px solid; border-bottom: 3px solid; }

    .footer {
      position: absolute;
      bottom: 22px;
      left: 34px;
      right: 34px;
      display: flex;
      justify-content: space-between;
      color: #7f8d95;
      font-family: Consolas, monospace;
      text-transform: uppercase;
      letter-spacing: 2px;
      font-size: 0.9rem;
    }

    .footer strong {
      color: #00b7ff;
      font-weight: 500;
    }

    @keyframes blink {
      0%, 45% { opacity: 1; }
      46%, 100% { opacity: 0; }
    }

    @media (max-width: 640px) {
      .panel {
        padding: 24px;
        min-height: 560px;
      }

      .top-bar, .footer {
        font-size: 0.75rem;
      }

      .top-bar {
        margin-bottom: 72px;
        flex-direction: column;
      }

      .footer {
        left: 24px;
        right: 24px;
        gap: 12px;
        flex-direction: column;
        text-align: center;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="panel">
      <div class="corner tl"></div>
      <div class="corner br"></div>

      <div class="top-bar">
        <div>Étape 01 sur 01</div>
        <div class="tag">Thibault / Interface</div>
      </div>

      <div class="content">
        <h1>
          Ceci est le site
          <span>de Thibault</span>
        </h1>
        <p class="subtitle">Bienvenue dans mon espace numérique.</p>

        <div class="terminal">
          <p>$ systemctl start thibault-site</p>
          <p>Status : online<span class="cursor"></span></p>
        </div>
      </div>

      <div class="footer">
        <p>Apprenez. Explorez. Testez.</p>
        <p><strong>Éthique & Responsable</strong></p>
      </div>
    </section>
  </main>
</body>
</html>
